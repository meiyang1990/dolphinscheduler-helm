{{- if .Values.yarnClusterConf.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "dolphinscheduler.fullname" . }}-yarn-cluster-conf
  labels:
    app.kubernetes.io/name: {{ include "dolphinscheduler.fullname" . }}-yarn-cluster-conf
    {{- include "dolphinscheduler.common.labels" . | nindent 4 }}
data:
  yarn-site.xml: |-
{{ .Files.Get "extra_cluster_conf/yarn-cluster-conf/yarn-site.xml" | indent 4 }}
  core-site.xml: |-
{{ .Files.Get "extra_cluster_conf/yarn-cluster-conf/core-site.xml" | indent 4 }}
  hdfs-site.xml: |-
{{ .Files.Get "extra_cluster_conf/yarn-cluster-conf/hdfs-site.xml" | indent 4 }}
  hive-site.xml: |-
{{ .Files.Get "extra_cluster_conf/yarn-cluster-conf/hive-site.xml" | indent 4 }}
{{- end }}