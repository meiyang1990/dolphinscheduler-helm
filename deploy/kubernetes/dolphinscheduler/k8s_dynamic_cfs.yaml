# ==========================
# 百度 CCE 官方 CFS 动态供给全套 YAML
# 仅需修改：NFS_SERVER + NFS_PATH
# ==========================

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: nfs-client-provisioner-runner
rules:
  - apiGroups: [""]
    resources: ["persistentvolumes"]
    verbs: ["get", "list", "watch", "create", "delete"]
  - apiGroups: [""]
    resources: ["persistentvolumeclaims"]
    verbs: ["get", "list", "watch", "update"]
  - apiGroups: ["storage.k8s.io"]
    resources: ["storageclasses"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["create", "update", "patch"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: run-nfs-client-provisioner
subjects:
  - kind: ServiceAccount
    name: nfs-client-provisioner
    namespace: kube-system
roleRef:
  kind: ClusterRole
  name: nfs-client-provisioner-runner
  apiGroup: rbac.authorization.k8s.io

---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: leader-locking-nfs-client-provisioner
  namespace: kube-system
rules:
  - apiGroups: [""]
    resources: ["endpoints"]
    verbs: ["get", "list", "watch", "create", "update", "patch"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: leader-locking-nfs-client-provisioner
  namespace: kube-system
subjects:
  - kind: ServiceAccount
    name: nfs-client-provisioner
    namespace: kube-system
roleRef:
  kind: Role
  name: leader-locking-nfs-client-provisioner
  apiGroup: rbac.authorization.k8s.io

---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: nfs-client-provisioner
  namespace: kube-system

---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: pv-cfs-bootstrap
spec:
  capacity:
    storage: 5Gi
  accessModes:
    - ReadWriteMany
  persistentVolumeReclaimPolicy: Retain
  mountOptions:
    - hard
    - nfsvers=4.1
  nfs:
    path: /
    server: cfs-AuyfsEHuFq.lb-5zxcesgq.cfs.bj.baidubce.com  # <--- 你的CFS挂载地址

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: pvc-cfs-bootstrap
  namespace: kube-system
spec:
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: 5Gi
  volumeName: pv-cfs-bootstrap

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nfs-client-provisioner
  namespace: kube-system
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: nfs-client-provisioner
  template:
    metadata:
      labels:
        app: nfs-client-provisioner
    spec:
      serviceAccountName: nfs-client-provisioner
      containers:
        - name: provisioner
          image: registry.baidubce.com/cce-plugin-pro/nfs-client-provisioner:latest
          volumeMounts:
            - name: nfs-root
              mountPath: /persistentvolumes
          env:
            - name: PROVISIONER_NAME
              value: baidubce/cfs-provisioner
            - name: NFS_SERVER
              value: cfs-AuyfsEHuFq.lb-5zxcesgq.cfs.bj.baidubce.com  # <--- 你的CFS挂载地址
            - name: NFS_PATH
              value: /                                           # <--- 一般填 /
      volumes:
        - name: nfs-root
          persistentVolumeClaim:
            claimName: pvc-cfs-bootstrap

---
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: cfs-shared-sc
provisioner: baidubce/cfs-provisioner
parameters:
  archiveOnDelete: "false"
  sharePath: "false"
mountOptions:
  - hard
  - nfsvers=4.1